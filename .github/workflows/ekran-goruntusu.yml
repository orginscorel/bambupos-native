name: POS ekran görüntüleri

# Elle tetiklenir: test/ekran_goruntusu_test.dart'ı GORUNTU_DIZINI ile
# çalıştırıp PNG'leri artifact olarak yükler (web ↔ uygulama görsel kıyas).

on:
  workflow_dispatch:
    inputs:
      suzgec:
        description: 'Test adı süzgeci (--plain-name)'
        required: false
        default: 'kasa'

env:
  FLUTTER_VERSION: '3.47.8'

defaults:
  run:
    working-directory: pos-app

jobs:
  goruntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: mkdir -p goruntu && GORUNTU_DIZINI="$PWD/goruntu" flutter test test/ekran_goruntusu_test.dart --plain-name "${{ inputs.suzgec }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekran-goruntuleri
          path: pos-app/goruntu/*.png
