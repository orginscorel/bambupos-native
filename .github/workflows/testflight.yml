# BamBumPOS Personel — TestFlight. Yeniden derlemez: en son imzasız derlemeyi
# imza/appstore.mobileprovision ile App Store dağıtımı için imzalar ve App Store Connect'e yükler.
# Gizliler: IOS_P12_B64, IOS_P12_PASS, ASC_KEY_P8 (App Store Connect API anahtarı)
name: TestFlight
on:
  push:
    branches: [personel-app]
    paths: ['imza/appstore.mobileprovision']
  workflow_call:
permissions:
  contents: read
env:
  ASC_KEY_ID: 5Z9AN85989
  ASC_ISSUER: e0998d8d-1026-4fe2-b8bd-d2f5715dbef8
jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personel-app
      - name: Hazır mı
        id: p
        env:
          K: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -f imza/appstore.mobileprovision ] && [ -n "$K" ]; then echo "var=1" >> $GITHUB_OUTPUT; else echo "Profil ya da ASC_KEY_P8 yok — atlanıyor"; fi
      - name: Son imzasız derlemeyi indir
        if: steps.p.outputs.var == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --repo "${{ github.repository }}" --limit 50 --json tagName -q '[.[] | select(.tagName|test("^personel-[0-9]+$"))][0].tagName')
          echo "Derleme: $TAG"
          gh release download "$TAG" --repo "${{ github.repository }}" -p Runner-imzasiz.ipa -D in
      - name: Anahtarlığı hazırla
        if: steps.p.outputs.var == '1'
        env:
          P12: ${{ secrets.IOS_P12_B64 }}
          PASS: ${{ secrets.IOS_P12_PASS }}
          K: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KC=$RUNNER_TEMP/imza.keychain-db; KP=$(uuidgen)
          echo "$P12" | base64 --decode > $RUNNER_TEMP/d.p12
          security create-keychain -p "$KP" $KC
          security set-keychain-settings -lut 1800 $KC
          security unlock-keychain -p "$KP" $KC
          security import $RUNNER_TEMP/d.p12 -P "$PASS" -A -t cert -f pkcs12 -k $KC
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" $KC >/dev/null
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')
          rm -f $RUNNER_TEMP/d.p12
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$K" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: İmzala
        if: steps.p.outputs.var == '1'
        run: |
          set -e
          cd in && unzip -q Runner-imzasiz.ipa && APP=Payload/Runner.app
          cp ../imza/appstore.mobileprovision $APP/embedded.mobileprovision
          security cms -D -i $APP/embedded.mobileprovision > prof.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' prof.plist > ent.plist
          KIMLIK=$(security find-identity -v -p codesigning | grep -o '"iPhone Distribution[^"]*\|"Apple Distribution[^"]*\|"iOS Distribution[^"]*' | head -1 | tr -d '"')
          find $APP/Frameworks -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) 2>/dev/null | while read f; do
            codesign -f -s "$KIMLIK" --timestamp=none "$f"; done
          find $APP/PlugIns -maxdepth 1 -name '*.appex' 2>/dev/null | while read f; do
            codesign -f -s "$KIMLIK" --timestamp=none "$f"; done
          codesign -f -s "$KIMLIK" --entitlements ent.plist --timestamp=none $APP
          codesign -v --deep --strict $APP
          zip -qry ../BamBumPOS-Personel-AppStore.ipa Payload
          echo "Sürüm: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' $APP/Info.plist) ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' $APP/Info.plist))"
      - name: TestFlight'a yükle
        if: steps.p.outputs.var == '1'
        run: |
          xcrun altool --validate-app -f BamBumPOS-Personel-AppStore.ipa -t ios --apiKey $ASC_KEY_ID --apiIssuer $ASC_ISSUER
          xcrun altool --upload-app -f BamBumPOS-Personel-AppStore.ipa -t ios --apiKey $ASC_KEY_ID --apiIssuer $ASC_ISSUER
      - name: Temizle
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/imza.keychain-db 2>/dev/null || true
          rm -rf ~/.appstoreconnect
