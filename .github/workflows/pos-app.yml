name: POS uygulaması (Android · iOS · Windows · macOS)

# BamBumPOS POS uygulaması — Flutter, NATİVE derleme (webview DEĞİL).
# Kaynak: pos-app/. Her platform kendi makinesinde derlenir; `pos-v*`
# etiketinde dört paket tek GitHub Release'te yayımlanır.
#
# İMZA:
#  - Android: ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD secret'ları
#    varsa KALICI anahtarla imzalanır (güncellemeler eski sürümün üstüne
#    kurulur). Yoksa debug anahtarı — yalnız deneme içindir.
#  - macOS: ad-hoc imza (Apple Developer kimliği eklenene kadar ilk açılışta
#    sağ tık → Aç gerekir).
#  - iOS: imzasız .ipa (mağaza/TestFlight için Apple sertifikası gerekir).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pos-app/**', '.github/workflows/pos-app.yml']
    tags: ['pos-v*']

concurrency:
  group: pos-app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

defaults:
  run:
    working-directory: pos-app

jobs:
  denetim:
    name: Analiz + test
    runs-on: ubuntu-latest
    outputs:
      surum: ${{ steps.surum.outputs.surum }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - id: surum
        run: |
          echo "surum=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: denetim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: İmza anahtarı
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/imza.p12
            printf 'storeFile=imza.p12\nstorePassword=%s\nkeyAlias=bambumpos\nkeyPassword=%s\nstoreType=pkcs12\n' "$KS_PASS" "$KS_PASS" > android/key.properties
            echo "KALICI anahtarla imzalanacak."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 yok — debug imzası (güncelleme üstüne kurulamaz)."
          fi
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm,android-arm64
      - name: Paketi adlandır
        run: |
          mkdir -p cikti
          cp build/app/outputs/flutter-apk/app-release.apk "cikti/BamBumPOS-POS-${{ needs.denetim.outputs.surum }}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: pos-app/cikti/*
          if-no-files-found: error

  windows:
    name: Windows kurulum
    needs: denetim
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $surum = "${{ needs.denetim.outputs.surum }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DSurum=$surum" "dagitim\windows-kurulum.iss"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "cikti\BamBumPOS-POS-$surum-Windows-Tasinabilir.zip"
      # ── WINDOWS 7 SP1 / 8.1 PAKETİ ──
      # Aynı derleme; Windows 8+ işlevlerini içe aktaran tablolar BBW7.dll'e
      # çevrilir (windows7/yamala.py), C++ çalışma kütüphaneleri pakete
      # konur (Windows 7'de çoğu zaman yok). Denetim yeni bir Windows 8+
      # işlevi bulursa adım durur — bozuk paket yayımlanmaz.
      - uses: ilammy/msvc-dev-cmd@v1
      # Windows 7 / 8.1 paketi ANA SÜRÜMÜ ASLA DURDURMAZ: bu adım başarısız
      # olursa Android/Windows/macOS/iOS yine yayımlanır; Windows 7 dosyası
      # o sürümde çıkmaz (eski Windows'taki uygulama güncelleme önermez).
      - name: Windows 7 paketi
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONUTF8 = '1'   # konsol cp1252: Türkçe/oklu çıktı patlamasın
          $surum = "${{ needs.denetim.outputs.surum }}"
          $w7 = "build\windows7"
          Copy-Item "build\windows\x64\runner\Release" $w7 -Recurse
          # C++ çalışma kütüphaneleri (VC++ + Universal CRT) uygulamanın yanına — yamadan ÖNCE (msvcp140 da yamalanır).
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($crt.FullName)\*.dll" $w7
          $ucrt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Redist" -Recurse -Filter ucrtbase.dll | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -Last 1
          if ($ucrt) { Copy-Item "$($ucrt.DirectoryName)\*.dll" $w7 } else { Write-Warning "Universal CRT bulunamadı (KB2999226 gerekecek)" }
          python -m pip install --quiet pefile
          python windows7\yamala.py yamala $w7 build\bbw7.def
          if ($LASTEXITCODE -ne 0) { throw "yamala başarısız" }
          cl /nologo /O1 /GS- /W3 /LD windows7\bbw7.c /Fobuild\bbw7.obj /Fe"$w7\BBW7.dll" /link /NODEFAULTLIB /ENTRY:DllMain /DEF:build\bbw7.def kernel32.lib ws2_32.lib shlwapi.lib /SUBSYSTEM:WINDOWS,6.01 /OSVERSION:6.1
          if ($LASTEXITCODE -ne 0) { throw "BBW7.dll derlenemedi" }
          Remove-Item "$w7\BBW7.lib","$w7\BBW7.exp" -ErrorAction SilentlyContinue
          python windows7\yamala.py denetle $w7
          if ($LASTEXITCODE -ne 0) { throw "Windows 7 denetimi geçmedi" }
          # Açılış sınaması: yamalı paket, yamasız paket kadar ayakta kalmalı.
          function Ayakta($exe) { $p = Start-Process $exe -PassThru; Start-Sleep 20; $ok = -not $p.HasExited; if ($ok) { Stop-Process $p -Force } else { Write-Host "çıkış kodu $($p.ExitCode)" }; return $ok }
          $asil = Ayakta "build\windows\x64\runner\Release\BamBumPOS.exe"
          $yamali = Ayakta "$w7\BamBumPOS.exe"
          Write-Host "Açılış: asıl=$asil yamalı=$yamali"
          if ($asil -and -not $yamali) { throw "Yamalı paket açılmadı" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DSurum=$surum" "/DW7" "/DKaynak=..\build\windows7" "dagitim\windows-kurulum.iss"
          if ($LASTEXITCODE -ne 0) { throw "Windows 7 kurulumu üretilemedi" }
          Compress-Archive -Path "$w7\*" -DestinationPath "cikti\BamBumPOS-POS-$surum-Windows7-Tasinabilir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: pos-app/cikti/*
          if-no-files-found: error

  macos:
    name: macOS DMG
    needs: denetim
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: DMG
        run: |
          set -e
          APP="build/macos/Build/Products/Release/BamBumPOS.app"
          codesign --force --deep --sign - "$APP"
          mkdir -p cikti dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "BamBumPOS" -srcfolder dmg -ov -format UDZO "cikti/BamBumPOS-POS-${{ needs.denetim.outputs.surum }}-macOS.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: pos-app/cikti/*
          if-no-files-found: error

  ios:
    name: iOS (imzasız)
    needs: denetim
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # App Store Connect yalnız Xcode 26 (iOS 26 SDK) ile derlenmiş paketi kabul eder.
      - name: Xcode 26 seç
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "Xcode 26 yok"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer" && xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: IPA
        run: |
          set -e
          mkdir -p cikti Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "cikti/BamBumPOS-POS-${{ needs.denetim.outputs.surum }}-iOS-imzasiz.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: pos-app/cikti/*
          if-no-files-found: error

  # TestFlight / App Store: imzasız iOS paketini App Store profiliyle imzalar
  # ve App Store Connect'e yükler. Ana sürümü DURDURMAZ (yayın buna bağlı değil).
  # Gizliler: IOS_P12_B64, IOS_P12_PASS, ASC_KEY_P8 (personel uygulamasıyla ortak).
  testflight:
    name: TestFlight
    if: startsWith(github.ref, 'refs/tags/pos-v')
    needs: [denetim, ios]
    runs-on: macos-15
    continue-on-error: true
    env:
      ASC_KEY_ID: 5Z9AN85989
      ASC_ISSUER: e0998d8d-1026-4fe2-b8bd-d2f5715dbef8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios
          path: pos-app/in
      - name: Anahtarlığı hazırla
        env:
          P12: ${{ secrets.IOS_P12_B64 }}
          PASS: ${{ secrets.IOS_P12_PASS }}
          K: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KC=$RUNNER_TEMP/imza.keychain-db; KP=$(uuidgen)
          echo "$P12" | base64 --decode > $RUNNER_TEMP/d.p12
          security create-keychain -p "$KP" $KC
          security set-keychain-settings -lut 1800 $KC
          security unlock-keychain -p "$KP" $KC
          security import $RUNNER_TEMP/d.p12 -P "$PASS" -A -t cert -f pkcs12 -k $KC
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" $KC >/dev/null
          security list-keychains -d user -s $KC $(security list-keychains -d user | tr -d '"')
          rm -f $RUNNER_TEMP/d.p12
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$K" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: İmzala
        run: |
          set -e
          cd in && unzip -q *-iOS-imzasiz.ipa && APP=Payload/Runner.app
          cp ../ios-imza/appstore.mobileprovision $APP/embedded.mobileprovision
          security cms -D -i $APP/embedded.mobileprovision > prof.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' prof.plist > ent.plist
          KIMLIK=$(security find-identity -v -p codesigning | grep -o '"iPhone Distribution[^"]*\|"Apple Distribution[^"]*\|"iOS Distribution[^"]*' | head -1 | tr -d '"')
          find $APP/Frameworks -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) 2>/dev/null | while read f; do
            codesign -f -s "$KIMLIK" --timestamp=none "$f"; done
          find $APP/PlugIns -maxdepth 1 -name '*.appex' 2>/dev/null | while read f; do
            codesign -f -s "$KIMLIK" --timestamp=none "$f"; done
          codesign -f -s "$KIMLIK" --entitlements ent.plist --timestamp=none $APP
          codesign -v --deep --strict $APP
          zip -qry ../BamBumPOS-POS-AppStore.ipa Payload
          echo "Sürüm: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' $APP/Info.plist) ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' $APP/Info.plist))"
      - name: TestFlight'a yükle
        run: |
          xcrun altool --validate-app -f BamBumPOS-POS-AppStore.ipa -t ios --apiKey $ASC_KEY_ID --apiIssuer $ASC_ISSUER
          xcrun altool --upload-app -f BamBumPOS-POS-AppStore.ipa -t ios --apiKey $ASC_KEY_ID --apiIssuer $ASC_ISSUER
      - name: Temizle
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/imza.keychain-db 2>/dev/null || true
          rm -rf ~/.appstoreconnect

  yayin:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/pos-v')
    needs: [denetim, android, windows, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paketler
          merge-multiple: true
      - run: ls -la paketler
      - uses: softprops/action-gh-release@v2
        with:
          name: BamBumPOS POS ${{ needs.denetim.outputs.surum }}
          files: paketler/*
          body: |
            BamBumPOS POS uygulaması ${{ needs.denetim.outputs.surum }} — native (Flutter), yalnız POS ekranları.

            | Platform | Dosya |
            |---|---|
            | Android 7+ | `*-Android.apk` (doğrudan kurulum) |
            | Windows 10/11 | `*-Windows-Kurulum.exe` · taşınabilir `*.zip` |
            | Windows 7 SP1 / 8.1 | `*-Windows7-Kurulum.exe` · taşınabilir `*-Windows7-Tasinabilir.zip` |
            | macOS 11+ | `*-macOS.dmg` (ilk açılışta sağ tık → Aç) |
            | iOS | `*-iOS-imzasiz.ipa` (imzalanmadan kurulamaz) |

            İlk açılışta cihaz bir tanımlama kodu gösterir: İşletme Yönetimi → Cihazlar → Yeni tanımlı cihaz.
