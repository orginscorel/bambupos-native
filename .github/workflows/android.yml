name: Android (APK)

# BamBumPOS panelini Android uygulamasına paketler (Trusted Web Activity).
# Uygulama paneli kendi penceresinde açar — tarayıcı çubuğu yok, kendi
# simgesiyle kurulur, push bildirimi alır.
#
# TASARIM: `bubblewrap init` ETKİLEŞİMLİ soru soruyor (JDK kurulumu vb.) ve
# CI'da takılıyordu. Bu yüzden proje tanımı depoda hazır duruyor
# (android/twa-manifest.json) ve yalnızca `build` çalıştırılır — hiç soru yok.
#
# İMZA: `ANDROID_KEYSTORE_BASE64` + parola secret'ları varsa İMZALI APK/AAB
# üretilir. Yoksa CI kendi ürettiği geçici anahtarla imzalar — cihaza elle
# kurulabilir ama mağazaya yüklenemez. Hangisi olduğu çıktıda yazar.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: APK derle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Bubblewrap kur
        run: npm i -g @bubblewrap/cli@latest

      # Bubblewrap kendi JDK/SDK'sını indirmeye çalışmasın: runner'dakileri
      # kullansın. Bu dosya olmadan CLI soru sorar ve iş takılır.
      - name: Bubblewrap yapılandırması
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<JSON
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_SDK_ROOT}"
          }
          JSON
          cat ~/.bubblewrap/config.json

      - name: Projeyi hazırla
        run: |
          mkdir -p build/android
          cp android/twa-manifest.json build/android/twa-manifest.json

      - name: İmza anahtarı
        id: signing
        working-directory: build/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "İMZALI derleme (yayınlanabilir)."
          else
            # Geçici anahtar: derlemenin tamamlanması ve APK'nın cihaza
            # kurulabilmesi için. Mağaza yüklemesi için gerçek anahtar şart.
            keytool -genkeypair -v -keystore android.keystore \
              -alias bambumpos -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ci-temp-pass -keypass ci-temp-pass \
              -dname "CN=BamBumPOS CI, OU=CI, O=BamBumPOS, L=Istanbul, C=TR"
            echo "mode=ci-temp" >> "$GITHUB_OUTPUT"
            echo "UYARI: secret yok → GEÇİCİ anahtarla imzalandı. Mağazaya yüklenemez."
          fi

      - name: APK ve AAB derle
        working-directory: build/android
        env:
          MODE: ${{ steps.signing.outputs.mode }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$MODE" = "release" ]; then
            PASS="$KS_PASS"; KPASS="$KEY_PASS"
          else
            PASS="ci-temp-pass"; KPASS="ci-temp-pass"
          fi
          bubblewrap build --skipPwaValidation \
            --signingKeyPath ./android.keystore \
            --signingKeyAlias bambumpos \
            --signingKeystorePassword "$PASS" \
            --signingKeyPassword "$KPASS"

      - name: Üretilen paketleri listele
        working-directory: build/android
        run: find . -name "*.apk" -o -name "*.aab" | sed 's/^/  /'

      - name: Paketleri sakla
        uses: actions/upload-artifact@v4
        with:
          name: bambumpos-android
          path: |
            build/android/*.apk
            build/android/*.aab
          if-no-files-found: error
          retention-days: 30
