# BamBumPOS Patron — Android + iPhone EŞZAMANLI derleme + TestFlight.
#  - Android: kalıcı anahtarla imzalı APK (POS ile aynı anahtar, depo gizlisi).
#  - iPhone : imzasız derlenir; testflight.yml App Store profiliyle imzalayıp yükler.
# Çıktı: "patron-<çalışma no>" sürümü (APK + imzasız IPA). APK sunucuda
# bambumpos.com/indir/patron/ altına alınır; iPhone TestFlight ile dağıtılır.
name: Patron uygulaması
on:
  push:
    branches: [patron-app]
    paths-ignore: ['**.md', 'imza/**']
  workflow_dispatch:
permissions:
  contents: write
env:
  FLUTTER_VERSION: '3.47.8'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: İmza anahtarı
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KS_B64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 yok"; exit 1; }
          echo "$KS_B64" | base64 -d > android/app/imza.p12
          printf 'storeFile=imza.p12\nstorePassword=%s\nkeyAlias=bambumpos\nkeyPassword=%s\nstoreType=pkcs12\n' "$KS_PASS" "$KS_PASS" > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm,android-arm64 --build-number ${{ github.run_number }}
      - name: Adlandır
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p out && cp build/app/outputs/flutter-apk/app-release.apk "out/BamBumPOS-Patron-$V-Android.apk"
          rm -f android/app/imza.p12 android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/
          retention-days: 7
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 seç
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "Xcode 26 yok"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer" && xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Derle (imzasız)
        run: flutter build ios --release --no-codesign --build-number ${{ github.run_number }}
      - name: IPA paketle
        run: |
          mkdir -p out/Payload
          cp -R build/ios/iphoneos/Runner.app out/Payload/
          cd out && zip -qry Runner-imzasiz.ipa Payload && rm -rf Payload && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/
          retention-days: 7
  yayinla:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Sürüm oluştur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          gh release create "patron-${{ github.run_number }}" out/* \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Patron ${{ github.run_number }}" --notes "Android (imzalı) + iPhone (imzasız)" --prerelease
  testflight:
    needs: yayinla
    uses: ./.github/workflows/testflight.yml
    secrets: inherit
