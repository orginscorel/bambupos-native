name: Masaüstü (Windows · macOS · Linux)

# ÜÇ AYRI UYGULAMA üretir — hepsi aynı Tauri kabuğundan, farklı ürün
# yapılandırmasıyla (products/*.json): ad, kimlik, açılacak adres ve pencere
# davranışı. Böylece personel ve patron kendi simgesiyle kurulur; kasa
# terminaline yanlışlıkla patron paneli kurulmaz.
#
# Tauri üretim sunucusunda derlenemiyor (Rust yok) — derleme burada koşar.
# Kod imzalama secret'ı yoksa imzasız üretilir; SmartScreen/Gatekeeper uyarısı
# çıkar, kurulum yine yapılabilir.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: ${{ matrix.product }} · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        product: [bambumpos, personel, patron]
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable

      - name: Linux bağımlılıkları
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Kabuk saf Rust + statik dosya; npm bağımlılığı YOK.
      - name: Paketle
        working-directory: desktop-app
        run: npx --yes @tauri-apps/cli@^2 build --config products/${{ matrix.product }}.json

      - name: Çıktıyı sakla
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.product }}-${{ matrix.label }}
          path: desktop-app/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 30
