name: Masaüstü (Windows · macOS · Linux)

# BamBumPOS panelini masaüstü uygulamasına paketler (Tauri).
# Uygulama kendi penceresinde açılır; kasa/mutfak terminallerinde tarayıcı
# çubuğu ve sekme karmaşası olmaz.
#
# NOT: Tauri üretim sunucusunda derlenemiyor (Rust araç zinciri yok) — bu iş
# tam da bunun için Actions'ta koşar. macOS ve Windows çıktıları ilgili
# runner'larda üretilir.
#
# İMZA: kod imzalama secret'ları yoksa imzasız derlenir. Windows'ta
# SmartScreen, macOS'ta Gatekeeper uyarısı çıkar — kurulum yine yapılabilir.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux

    steps:
      - uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable

      - name: Linux bağımlılıkları
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Tauri CLI
        run: npm i -g @tauri-apps/cli@^2

      - name: Uygulamayı derle
        working-directory: desktop-app
        run: npm ci || npm install
      
      - name: Paketle
        working-directory: desktop-app
        run: npx tauri build

      - name: Çıktıyı sakla
        uses: actions/upload-artifact@v4
        with:
          name: bambumpos-desktop-${{ matrix.label }}
          path: |
            desktop-app/src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
          retention-days: 30
