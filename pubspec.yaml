name: bambumpos_personel
description: "BamBumPOS Personel — mesai, mola, görev ve vardiya"
publish_to: 'none'
version: 1.0.9+10

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  flutter_local_notifications: ^22.3.3
  workmanager: ^0.9.0
  ota_update: ^7.1.0
  intl: any
  image_picker: ^1.2.4
  geolocator: ^14.0.1
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/simge/logo.png
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf

flutter_launcher_icons:
  image_path: assets/simge/simge.png
  android: true
  adaptive_icon_background: "#5443D2"
  adaptive_icon_foreground: assets/simge/on_plan.png
  ios: true
  remove_alpha_ios: true
