<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <title>BamBumPOS</title>
    <style>
        html,body{margin:0;height:100%;background:#5443D2;overflow:hidden}
        iframe{border:0;width:100%;height:100%;display:block}
        #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
            justify-content:center;gap:14px;color:#fff;font:600 15px/1.3 system-ui,sans-serif}
        #boot .bar{width:170px;height:4px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
        #boot .bar span{display:block;width:40%;height:100%;background:#fff;border-radius:99px;
            animation:s 1.1s ease-in-out infinite}
        @keyframes s{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
    </style>
</head>
<body>
    <!-- Açılış ekranı: pencere açılır açılmaz marka görünür, panel yüklenince kaybolur. -->
    <div id="boot"><div>BamBumPOS</div><div class="bar"><span></span></div></div>
    <iframe id="app" src="https://bambumpos.com/panel" allow="clipboard-read; clipboard-write"></iframe>
    <script>
        document.getElementById('app').addEventListener('load', function () {
            var b = document.getElementById('boot');
            if (b) b.remove();
        });
    </script>
</body>
</html>
